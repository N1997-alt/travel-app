name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          SDK=$ANDROID_HOME
          SDKMANAGER=$(ls $SDK/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          # Accept all Android SDK licenses non-interactively
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # Install the platform + build tools required by config.xml (targetSdkVersion 34)
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Cordova
        run: npm install

      - name: Add Android platform
        run: npx cordova platform add android@12

      - name: Install plugins (explicit)
        run: |
          npx cordova plugin add cordova-plugin-file@8.1.3
          npx cordova plugin add cordova-plugin-x-socialsharing@6.0.4

      - name: Build debug APK
        run: npx cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: travel-app
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
